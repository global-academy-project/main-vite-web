# 해당 파일은 Compose 환경에서 사용되는 Nginx 설정 구성 파일
# Docker Compose Development 환경에서 사용되는 Nginx 설정 파일로, 
# Vite 개발 서버와 Spring Boot 서버 간의 프록시 설정을 포함

server {
    listen 80;

    location /api/ {
        proxy_pass http://spring-boot-application:60001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}